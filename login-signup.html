<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back2owner</title>
    <link rel="stylesheet" href="login-signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
 
    <div id="navbar">
    <div id="nav-left">
        <img src="logo_only.svg" alt="Logo" id="navbar-img"> 
        <a href="index.html" id="brand-name">Back2Owner</a>
    </div>
    <div id="nav-right">
        <!-- shown when login section is visible -->
        <button id="nav-signup-btn">Sign Up</button>
        <!-- shown when signup section is visible -->
        <button id="nav-login-btn" style="display:none;"><i class="fa-regular fa-user"></i>  Login</button>
    </div>
    </div>
 
    <!--User login section -->
    <div id="login-section">
        <h2>Login</h2>
        <br>
        <input type="email" id="login-email" placeholder="Enter your email" >
        <br>
        <input type="password" id="login-password" placeholder="Enter your password">
        <p>
            <a href="#" id="forgot-password" style="font-size: 13px; color: #062460;">Forgot Password?</a>
        </p>
        <br>
        <button id="login-button">Login</button>
        <br>
        <p>Don't have an account? <a href="#" id="open-signup">Sign up</a></p>
    </div>
 
    <!-- signup section -->
    <div id="signup-section">
        <h2>Sign Up</h2>
        <br>
        <input type="text" placeholder="Enter your name" id="signup-name">
        <br>
        <input type="email"  placeholder="Enter your email" id="signup-email">
        <br>
        <input type="password"  placeholder="Create a password" id="signup-password">
        <br>
        
        <input type="password" placeholder="Confirm your password" id="signup-confirm">
        <button id="signup-button">Sign Up</button>
        <br>
        <p>Already have an account? <a href="#" id="open-login">Login</a></p>
    </div>
 
    <footer id="footer">
        <p>© 2026 Back2owner. All rights reserved.</p>
    </footer>
 
<script src="login-signup.js"></script>
</body>
</html>
